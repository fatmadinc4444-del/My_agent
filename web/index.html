<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Konuşma Arkadaşı</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d0b1a; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }
      /* Vignette + grain done in CSS: costs the GPU nothing extra in the 3D pass. */
      #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(120% 95% at 50% 45%, rgba(0,0,0,0) 55%, rgba(8,4,20,0.55) 100%); }
      #fade { position: fixed; inset: 0; pointer-events: none; background: #0d0b1a; transition: opacity 600ms ease; }
      #fade.done { opacity: 0; }
      #hud { position: fixed; left: 8px; top: 8px; font: 11px/1.3 ui-monospace, monospace; color: #b9b3ff; pointer-events: none; white-space: pre; text-shadow: 0 1px 2px #000; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="vignette"></div>
    <div id="fade"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
